[package]
name = "latex-mobile"
version = "0.1.0"
edition = "2021"
license = "MIT"

[lib]
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
latex-mobile-xdv = { path = "../xdv-renderer" }
base64 = "0.22"
tectonic = { version = "=0.17.0", default-features = false }
tectonic_bundles = { version = "0.4", default-features = false }
tectonic_bridge_core = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"

[dependencies.tectonic_io_base]
version = "0.6"
[dependencies.tectonic_errors]
version = "0.3"
[dependencies.tectonic_status_base]
version = "0.2"
